<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The oxidom system daemon owns the name; any local user may drive it
       (same trust model as v2rayA's localhost web UI). -->
  <policy user="oxidom">
    <allow own="dev.keepinfov.oxidom.Daemon"/>
  </policy>
  <policy user="root">
    <allow own="dev.keepinfov.oxidom.Daemon"/>
  </policy>
  <policy context="default">
    <allow send_destination="dev.keepinfov.oxidom.Daemon"/>
    <allow receive_sender="dev.keepinfov.oxidom.Daemon"/>
  </policy>
</busconfig>
