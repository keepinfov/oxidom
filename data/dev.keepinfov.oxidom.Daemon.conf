<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The oxidom system daemon owns the name. -->
  <policy user="oxidom">
    <allow own="dev.keepinfov.oxidom.Daemon"/>
  </policy>
  <policy user="root">
    <allow own="dev.keepinfov.oxidom.Daemon"/>
  </policy>

  <!-- Who may drive it. The daemon runs privileged and its methods rewrite
       the machine's proxy configuration, spawn the core and edit subscriptions,
       so this is not an "any local user" surface: an unprivileged service
       account or a sandboxed app on the same machine must not be able to
       redirect the user's traffic. Admins (root, wheel) can already do all of
       this; the oxidom group is the opt-in way to add anybody else. -->
  <policy user="root">
    <allow send_destination="dev.keepinfov.oxidom.Daemon"/>
    <allow receive_sender="dev.keepinfov.oxidom.Daemon"/>
  </policy>
  <policy group="wheel">
    <allow send_destination="dev.keepinfov.oxidom.Daemon"/>
    <allow receive_sender="dev.keepinfov.oxidom.Daemon"/>
  </policy>
  <policy group="oxidom">
    <allow send_destination="dev.keepinfov.oxidom.Daemon"/>
    <allow receive_sender="dev.keepinfov.oxidom.Daemon"/>
  </policy>

  <policy context="default">
    <deny send_destination="dev.keepinfov.oxidom.Daemon"/>
  </policy>
</busconfig>
