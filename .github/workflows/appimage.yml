name: appimage

# The AppImage serves the desktops that cannot install oxidom-gui: Ubuntu 24.04
# LTS and Debian 12, whose libadwaita is 1.5 and 1.2 against a floor of 1.7.
#
# It is built on Debian 13 — the oldest distribution carrying libadwaita 1.7, so
# the bundled glibc is as old as it can be — and packed with sharun, which maps
# the bundled interpreter in userspace and needs no privileges. An earlier
# attempt used `nix bundle`, whose AppRun mounts through an unprivileged user
# namespace; Ubuntu has restricted those since 23.10, so it failed on the exact
# release it existed for. See packaging/appimage/build.sh.
#
# Called by release.yml on a tag, and runnable on demand. Never on a pull
# request: it compiles the GTK client from scratch.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The group names this file, not ${{ github.workflow }}. In a called workflow
# that expression is the *caller's* name, so both workflows release.yml calls
# computed the same group — and the same one as release.yml itself — and with
# cancel-in-progress they cancelled each other before either started. The first
# tag produced a release run with no packages and no AppImage in it.
concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: build dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config curl ca-certificates git unzip \
            libgtk-4-dev libadwaita-1-dev \
            patchelf squashfs-tools libglib2.0-bin \
            file binutils findutils \
            locales \
            adwaita-icon-theme hicolor-icon-theme desktop-file-utils

      - uses: actions/checkout@v4

      # Debian 13 ships Rust 1.85.0, exactly the floor. rustup removes the
      # question of whether the archive has drifted under us.
      - name: rust toolchain
        run: |
          set -eux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: build
        run: packaging/appimage/build.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  # The point of the exercise. These two are why the AppImage exists, and an
  # AppImage that does not start on them has no audience the .deb does not
  # already serve.
  runs-on-old-distributions:
    needs: build
    name: runs on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist

      - name: how old is this
        run: |
          set -eux
          ldd --version | head -1
          cat /etc/os-release | grep PRETTY_NAME

      - name: the AppImage answers
        run: |
          set -eu
          app=$(find dist -name '*.AppImage' -type f | head -1)
          test -n "$app"
          chmod +x "$app"
          # Extraction, not mounting. A bare container has neither a SUID
          # fusermount nor permission to unshare, and neither says anything
          # about whether the bundle works — which is the question here. How it
          # is mounted on a real desktop is a separate matter, and uruntime
          # prefers fusermount3, which those desktops have.
          set +e
          out=$("$app" --appimage-extract-and-run --version 2>&1); rc=$?
          set -e
          echo "exit $rc"
          echo "$out"
          if [ "$rc" != 0 ]; then
            echo "::error::the AppImage did not start on ${{ matrix.image }}, which is a distribution it exists to serve"
            exit 1
          fi
          echo "$out" | grep -q '^oxidom-gui '

      # The interface is a thin client: without the daemon beside it and a core
      # to drive, a bundle that starts is still useless.
      - name: it carries the daemon and a core
        run: |
          set -eu
          app=$(find dist -name '*.AppImage' -type f | head -1)
          # --appimage-extract, not extract-and-run: the latter unpacks into a
          # temporary directory it removes again, so there is nothing left to
          # look at. This one writes ./squashfs-root and leaves it.
          "$app" --appimage-extract > /dev/null
          d=squashfs-root
          ls "$d/bin"
          test -x "$d/bin/oxidom"
          test -x "$d/bin/oxidom-gui"
          test -x "$d/bin/xray"
          test -f "$d/share/glib-2.0/schemas/gschemas.compiled"
          test -d "$d/share/icons/Adwaita"
          # The bundled loader is the whole point: an absolute interpreter would
          # mean the binary is still asking this host for its glibc, which is
          # exactly what it cannot have. patchelf answers this precisely; the
          # string sits near the end of the file, so grepping a prefix does not.
          (apt-get update && apt-get install -y --no-install-recommends patchelf) > /dev/null 2>&1 \
            || (dnf install -y patchelf > /dev/null 2>&1) || true
          if command -v patchelf > /dev/null; then
            interp=$(patchelf --print-interpreter "$d/shared/bin/oxidom-gui")
            echo "interpreter: $interp"
            case "$interp" in
              /*) echo "::error::the interpreter is absolute ($interp), so the bundled glibc is not being used"; exit 1 ;;
            esac
          else
            echo "::warning::patchelf unavailable, interpreter not checked"
          fi
