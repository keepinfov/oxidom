name: appimage

# The AppImage serves the desktops that cannot install oxidom-gui: Ubuntu 24.04
# LTS and Debian 12, whose libadwaita is 1.5 and 1.2 against a floor of 1.7.
#
# It is built on Debian 13 — the oldest distribution carrying libadwaita 1.7, so
# the bundled glibc is as old as it can be — and packed with sharun, which maps
# the bundled interpreter in userspace and needs no privileges. An earlier
# attempt used `nix bundle`, whose AppRun mounts through an unprivileged user
# namespace; Ubuntu has restricted those since 23.10, so it failed on the exact
# release it existed for. See packaging/appimage/build.sh.
#
# Called by release.yml on a tag, and runnable on demand. Never on a pull
# request: it compiles the GTK client from scratch.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The group names this file, not ${{ github.workflow }}. In a called workflow
# that expression is the *caller's* name, so both workflows release.yml calls
# computed the same group — and the same one as release.yml itself — and with
# cancel-in-progress they cancelled each other before either started. The first
# tag produced a release run with no packages and no AppImage in it.
concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: debian:trixie
    steps:
      - name: build dependencies
        run: |
          set -eux
          apt-get update
          # fonts-dejavu-core: build.sh runs the same Xvfb smoke as the jobs
          # below, and a bare container has no fonts for Pango to measure.
          apt-get install -y --no-install-recommends \
            build-essential pkg-config curl ca-certificates git unzip \
            libgtk-4-dev libadwaita-1-dev \
            patchelf squashfs-tools libglib2.0-bin \
            dbus-daemon xvfb xauth \
            file binutils findutils \
            locales \
            adwaita-icon-theme hicolor-icon-theme desktop-file-utils \
            fonts-dejavu-core

      - uses: actions/checkout@v4

      # Debian 13 ships Rust 1.85.0, exactly the floor. rustup removes the
      # question of whether the archive has drifted under us.
      - name: rust toolchain
        run: |
          set -eux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: build
        run: packaging/appimage/build.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  # The point of the exercise. These two are why the AppImage exists, and an
  # AppImage that does not start on them has no audience the .deb does not
  # already serve.
  runs-on-old-distributions:
    needs: build
    name: runs on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist

      - name: how old is this
        run: |
          set -eux
          ldd --version | head -1
          cat /etc/os-release | grep PRETTY_NAME

      - name: the AppImage answers
        run: |
          set -eu
          app=$(find dist -name '*.AppImage' -type f | head -1)
          test -n "$app"
          chmod +x "$app"
          # Extraction, not mounting. A bare container has neither a SUID
          # fusermount nor permission to unshare, and neither says anything
          # about whether the bundle works — which is the question here. How it
          # is mounted on a real desktop is a separate matter, and uruntime
          # prefers fusermount3, which those desktops have.
          set +e
          out=$("$app" --appimage-extract-and-run --version 2>&1); rc=$?
          set -e
          echo "exit $rc"
          echo "$out"
          if [ "$rc" != 0 ]; then
            echo "::error::the AppImage did not start on ${{ matrix.image }}, which is a distribution it exists to serve"
            exit 1
          fi
          echo "$out" | grep -q '^oxidom-gui '

      # The interface is a thin client: without the daemon beside it and a core
      # to drive, a bundle that starts is still useless.
      - name: it carries the daemon and a core
        run: |
          set -eu
          app=$(find dist -name '*.AppImage' -type f | head -1)
          # --appimage-extract, not extract-and-run: the latter unpacks into a
          # temporary directory it removes again, so there is nothing left to
          # look at. This one writes ./squashfs-root and leaves it.
          "$app" --appimage-extract > /dev/null
          d=squashfs-root
          ls "$d/bin"
          test -x "$d/bin/oxidom"
          test -x "$d/bin/oxidom-gui"
          test -x "$d/bin/xray"
          test -s "$d/share/xray/geoip.dat"
          test -s "$d/share/xray/geosite.dat"
          # Double quotes with the one `$` escaped: the pattern is literal
          # data, so shellcheck's "this will not expand" warning does not
          # apply, and suppressing it would hide the next one too.
          grep -q "^XRAY_LOCATION_ASSET=\${SHARUN_DIR}/share/xray$" "$d/.env"
          test -f "$d/share/glib-2.0/schemas/gschemas.compiled"
          test -d "$d/share/icons/Adwaita"
          # Every generated configuration references geoip:private and
          # geosite:private; verify the bundled core loads both offline from
          # share/xray in a fresh HOME with no host or user geo files.
          probe_home=$(mktemp -d)
          work_cfg="$probe_home/geo-probe.json"
          cat > "$work_cfg" <<'JSON'
          {"log":{"loglevel":"error"},
           "outbounds":[{"protocol":"freedom","tag":"direct"}],
           "dns":{"servers":[{"address":"1.1.1.1","domains":["geosite:private"],"skipFallback":true}]},
           "routing":{"rules":[{"type":"field","ip":["geoip:private"],"outboundTag":"direct"}]}}
          JSON
          HOME="$probe_home" XRAY_LOCATION_ASSET="$PWD/$d/share/xray" \
            "$d/bin/xray" run -test -c "$work_cfg"
          rm -rf "$probe_home"
          # The bundled loader is the whole point: an absolute interpreter would
          # mean the binary is still asking this host for its glibc, which is
          # exactly what it cannot have. patchelf answers this precisely; the
          # string sits near the end of the file, so grepping a prefix does not.
          (apt-get update && apt-get install -y --no-install-recommends patchelf) > /dev/null 2>&1 \
            || (dnf install -y patchelf > /dev/null 2>&1) || true
          if command -v patchelf > /dev/null; then
            interp=$(patchelf --print-interpreter "$d/shared/bin/oxidom-gui")
            echo "interpreter: $interp"
            case "$interp" in
              /*) echo "::error::the interpreter is absolute ($interp), so the bundled glibc is not being used"; exit 1 ;;
            esac
          else
            echo "::warning::patchelf unavailable, interpreter not checked"
          fi

      # Loading the lists is not the same as the client showing they loaded.
      # The first window is assembled from daemon-side facts, and a core that
      # cannot load the bundled lists replaces it with a warning — so the
      # screen a user meets is the only end-to-end evidence, and these two
      # images are the reason the AppImage exists. Xvfb and a private session
      # bus reach that screen without a desktop; gdbus asks the daemon the
      # client itself started on it. packaging/appimage/build.sh runs the same
      # check where the build host has the tools; here they are a dependency
      # of the job, so a missing one is an error rather than a skip.
      - name: the first GUI state reports usable geo data
        run: |
          set -eu
          apt-get update
          # A bare container ships no fonts. Pango then reports metrics nothing
          # can lay out against, and GTK has died on the first ConfigureWindow
          # under Xvfb because of it. The font and the UTF-8 locale below are
          # the environment a desktop provides, so a failure here is the
          # bundle's rather than the container's.
          apt-get install -y --no-install-recommends \
            patchelf dbus-daemon xvfb xauth libglib2.0-bin fonts-dejavu-core
          for t in dbus-daemon xvfb-run gdbus; do
            command -v "$t" > /dev/null || {
              echo "::error::$t is missing from ${{ matrix.image }}"
              exit 1
            }
          done
          test -x ./squashfs-root/AppRun || {
            echo "::error::squashfs-root/AppRun is missing; the extraction step did not run"
            exit 1
          }
          # sockaddr_un holds 108 bytes. $TMPDIR on a runner is long enough
          # that the bus socket below it would no longer fit, so pin the root
          # under /tmp.
          smoke=$(mktemp -d /tmp/oxidom-appimage-smoke.XXXXXX)
          gui_pid=
          bus_pid=
          cleanup_smoke() {
            kill "$gui_pid" "$bus_pid" 2> /dev/null || true
            rm -rf "$smoke"
          }
          trap cleanup_smoke EXIT

          mkdir -p "$smoke/home" "$smoke/run"
          chmod 700 "$smoke/run"
          # One socket, external auth, and the ordinary session policy. No
          # system bus is reachable below, so the only daemon that can own the
          # name here is the one the client under test spawns.
          cat > "$smoke/bus.conf" <<BUS
          <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <type>session</type>
            <listen>unix:path=$smoke/bus</listen>
            <auth>EXTERNAL</auth>
            <policy context="default">
              <allow send_destination="*" eavesdrop="true"/>
              <allow eavesdrop="true"/>
              <allow own="*"/>
            </policy>
          </busconfig>
          BUS
          bus_pid=$(dbus-daemon --config-file="$smoke/bus.conf" --fork --print-pid)
          i=0
          while [ "$i" -lt 100 ]; do
            [ -S "$smoke/bus" ] && break
            sleep 0.1
            i=$((i + 1))
          done
          [ -S "$smoke/bus" ] || { echo "::error::the private session bus did not start"; exit 1; }

          # xvfb-run owns a shell of its own, and $! names that shell rather
          # than the application beneath it. Record the PID after `exec`, so
          # cleanup stops the client and not a wrapper that has already gone.
          cat > "$smoke/run-gui" <<'SH'
          #!/bin/sh
          echo "$$" > "$OXIDOM_SMOKE_PIDFILE"
          exec "$@"
          SH
          chmod +x "$smoke/run-gui"

          export DBUS_SESSION_BUS_ADDRESS="unix:path=$smoke/bus"
          export DBUS_SYSTEM_BUS_ADDRESS="unix:path=$smoke/no-system-bus"
          HOME="$smoke/home" \
          XDG_CONFIG_HOME="$smoke/home/.config" \
          XDG_DATA_HOME="$smoke/home/.local/share" \
          XDG_STATE_HOME="$smoke/home/.local/state" \
          XDG_CACHE_HOME="$smoke/home/.cache" \
          XDG_RUNTIME_DIR="$smoke/run" \
          GSETTINGS_BACKEND=memory \
          GDK_BACKEND=x11 \
          GSK_RENDERER=cairo \
          LANG=C.UTF-8 \
          GTK_A11Y=none \
          NO_AT_BRIDGE=1 \
          OXIDOM_SMOKE_PIDFILE="$smoke/gui.pid" \
            xvfb-run -a "$smoke/run-gui" ./squashfs-root/AppRun --debug \
            >"$smoke/gui.out" 2>"$smoke/gui.err" &
          i=0
          while [ "$i" -lt 200 ] && [ ! -s "$smoke/gui.pid" ]; do
            sleep 0.1
            i=$((i + 1))
          done
          [ -s "$smoke/gui.pid" ] || { echo "::error::the GUI did not start under Xvfb"; exit 1; }
          gui_pid=$(cat "$smoke/gui.pid")

          gui_log="$smoke/home/.local/share/oxidom/oxidom-gui.log"
          i=0
          while [ "$i" -lt 200 ] && ! grep -qs 'Loading daemon state' "$gui_log"; do
            if ! kill -0 "$gui_pid" 2> /dev/null; then
              echo "::error::the GUI exited before loading daemon state"
              # GTK writes fatal errors to stdout, so gui.err can be empty
              # while the reason sits in gui.out. Print both, labelled.
              echo "--- gui.out ---" >&2
              cat "$smoke/gui.out" >&2 || true
              echo "--- gui.err ---" >&2
              cat "$smoke/gui.err" >&2 || true
              exit 1
            fi
            sleep 0.1
            i=$((i + 1))
          done
          if ! grep -qs 'Loading daemon state' "$gui_log"; then
            echo "::error::the GUI never reached the first daemon state"
            echo "--- gui.out ---" >&2
            cat "$smoke/gui.out" >&2 || true
            echo "--- gui.err ---" >&2
            cat "$smoke/gui.err" >&2 || true
            exit 1
          fi

          # Wait for the spawned daemon to own the name, then ask it once.
          # Asking in a loop would hide the interesting failure — a started
          # daemon that cannot answer — behind a retry count.
          owned=
          i=0
          while [ "$i" -lt 200 ]; do
            if gdbus call --session --dest org.freedesktop.DBus \
                --object-path /org/freedesktop/DBus \
                --method org.freedesktop.DBus.NameHasOwner \
                dev.keepinfov.oxidom.Daemon 2> /dev/null | grep -q 'true'; then
              owned=1
              break
            fi
            sleep 0.1
            i=$((i + 1))
          done
          [ -n "$owned" ] || { echo "::error::no daemon answered on the private session bus"; exit 1; }

          # RuntimeInfo runs the core against the bundled lists before it
          # answers, so this single call is the wait for that probe as well.
          if ! info=$(timeout 20 gdbus call --session \
              --dest dev.keepinfov.oxidom.Daemon \
              --object-path /dev/keepinfov/oxidom/Daemon \
              --method dev.keepinfov.oxidom1.RuntimeInfo); then
            echo "::error::the daemon did not answer RuntimeInfo"
            echo "--- gui.out ---" >&2
            cat "$smoke/gui.out" >&2 || true
            echo "--- gui.err ---" >&2
            cat "$smoke/gui.err" >&2 || true
            exit 1
          fi
          echo "$info"
          case "$info" in
            *'"usable":true'*) ;;
            *) echo "::error::the daemon reports the bundled geo data unusable: $info"; exit 1 ;;
          esac
          case "$info" in
            *'"xray_error":null'*) ;;
            *) echo "::error::the daemon resolved no core for the first state: $info"; exit 1 ;;
          esac
          kill -0 "$gui_pid" 2> /dev/null || { echo "::error::the GUI did not survive its first state"; exit 1; }
          echo "first GUI state: geo data usable, no core error"
