name: appimage

# The AppImage is what serves the distributions that cannot install oxidom-gui:
# Ubuntu 24.04 LTS and Debian 12, whose libadwaita is 1.5 and 1.2 against a floor
# of 1.7. That is its whole reason to exist, so the job that matters here is not
# the build — it is running the result on those two, which is the only thing that
# proves the approach works at all. See packaging/appimage/build.sh for why this
# is a `nix bundle` and not linuxdeploy.
#
# It bundles the whole GTK closure, so this is the most expensive job in the
# repository by a wide margin and has no business running on a pull request. It
# is called by release.yml, which a `v*` tag triggers — a release candidate being
# the point at which the answer matters — and can be run on demand while the
# bundling itself is being worked on. Being called rather than separately
# triggered is what lets the release job collect what it built.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: build
        run: packaging/appimage/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  # The point of the whole exercise. If this fails, the AppImage has no audience
  # that the .deb does not already serve, and saying so is better than shipping
  # a file that only works where it was not needed.
  runs-on-old-distributions:
    needs: build
    name: runs on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist
      - name: how old is this glibc
        run: |
          set -eux
          ldd --version | head -1
      # The AppImage's AppRun mounts its store through an unprivileged user
      # namespace, so a host that forbids those cannot run it. That is a real
      # limitation and the thing this job exists to measure — but a sandbox that
      # forbids namespaces for its own reasons produces the identical failure,
      # and a test that cannot tell those apart is worse than no test, because
      # somebody will eventually wave it through. So say which one it is.
      - name: can this host create a user namespace at all
        id: userns
        run: |
          set -eu
          restrict=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)
          maxns=$(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo 0)
          echo "apparmor_restrict_unprivileged_userns=$restrict max_user_namespaces=$maxns"
          if unshare --user --map-root-user true 2>/dev/null; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
            echo "unprivileged user namespaces work here"
          else
            echo "available=no" >> "$GITHUB_OUTPUT"
            echo "::warning::this host forbids unprivileged user namespaces, so the AppImage cannot start here whatever its contents"
          fi

      - name: the AppImage answers
        run: |
          set -eux
          # Resolve to one path rather than running a glob as a command name:
          # with two matches the shell would run the first and pass the second
          # as an argument, and the test would quietly mean something else.
          app=$(find dist -name '*.AppImage' -type f | head -1)
          test -n "$app"
          chmod +x "$app"
          # --appimage-extract-and-run avoids needing FUSE, which these images
          # do not have and which is not what is under test here.
          set +e
          out=$("$app" --appimage-extract-and-run --version 2>&1); rc=$?
          set -e
          echo "exit $rc: $out"
          if [ "$rc" = 0 ]; then
            "$app" --appimage-extract-and-run --help > /dev/null
            exit 0
          fi
          if [ '${{ steps.userns.outputs.available }}' = no ]; then
            echo "::error::the AppImage did not start, and this host forbids unprivileged user namespaces. On ${{ matrix.image }} that is the answer, not an accident: the bundle needs a mechanism this distribution does not permit."
          else
            echo "::error::the AppImage did not start on a host that does permit user namespaces, so this is the bundle's own fault."
          fi
          exit 1
