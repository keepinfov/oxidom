name: lint

# Clippy needs the GTK and libadwaita headers the GUI crate links against, and
# the versions this project requires are newer than the runner images ship, so
# this one goes through the flake's dev shell rather than apt.

# No path filter, deliberately. `clippy` is a required status check, and a
# required check that does not run is not a skipped check: GitHub waits for a
# context that will never report, and the pull request cannot be merged at all.
# A documentation-only branch hit exactly that. `format.yml`, which owns the two
# jobs that were already required, carries no filter either.
#
# The filter was worth little anyway. This job is around a minute against a warm
# cache, and the expensive one — `nix-build`, at twelve — is filtered and
# deliberately *not* required, which is where the saving actually lives.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-
      - name: cargo clippy
        run: nix develop -c cargo clippy --workspace --all-targets --all-features -- -D warnings
