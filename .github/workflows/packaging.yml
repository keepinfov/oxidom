name: packaging

# The AUR package once sat broken because a checksum in PKGBUILD no longer
# matched the file next to it — makepkg stopped at the validity check before it
# reached a compiler, and nothing in the repository noticed. The units are now
# installed straight out of the clone, so there is no second copy to drift and
# no checksum to go stale. What is left is the generated file that can still
# disagree with its source, and the linter. Both are cheap, need no network and
# no compile.

on:
  push:
    branches: [master]
    paths: ['packaging/**', '.github/workflows/packaging.yml']
  pull_request:
    paths: ['packaging/**', '.github/workflows/packaging.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap half of the .deb/.rpm question. Building them needs ten containers
  # and four release builds, which is a tag-time job (see packages.yml); this is
  # everything that can be answered in seconds without a compiler, and it catches
  # the mistakes actually made while editing packaging — a manifest that no
  # longer parses, a script with a syntax error, a file renamed out from under
  # the manifest that names it.
  nfpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: the manifests parse
        run: |
          set -eu
          python3 - <<'PY'
          import sys, yaml
          for f in ("packaging/nfpm/oxidom.yaml", "packaging/nfpm/oxidom-gui.yaml"):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f"{f}: ok")
          PY

      - name: every file a manifest installs exists
        run: |
          set -eu
          status=0
          # target/release/* is produced by the build, so it is the one source
          # that legitimately does not exist in a checkout.
          srcs=$(grep -h '^  - src:' packaging/nfpm/*.yaml | sed 's/^  - src: *//' | grep -v '^target/release/')
          for f in $srcs; do
            if [ ! -e "$f" ]; then
              echo "::error::a package manifest installs $f, which is not in the tree"
              status=1
            fi
          done
          echo "$srcs" | sed 's/^/found /'
          exit $status

      - name: every script a manifest names exists and passes shellcheck
        run: |
          set -eu
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          status=0
          for f in $(grep -hE '^\s+(pre|post)(install|remove): ' packaging/nfpm/*.yaml | sed 's/.*: *//'); do
            if [ ! -x "$f" ]; then
              echo "::error::a package manifest names $f, which is missing or not executable"
              status=1
            fi
          done
          [ "$status" = 0 ] || exit $status
          shellcheck packaging/nfpm/scripts/*.sh packaging/nfpm/*.sh packaging/*.sh

  aur:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: install tools
        run: pacman -Sy --noconfirm --needed git namcap

      - uses: actions/checkout@v4

      - name: .SRCINFO matches PKGBUILD
        working-directory: packaging/aur
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'makepkg --printsrcinfo' > /tmp/SRCINFO.expected
          if ! diff -u .SRCINFO /tmp/SRCINFO.expected; then
            echo "::error file=packaging/aur/.SRCINFO::out of date — run 'makepkg --printsrcinfo > .SRCINFO'"
            exit 1
          fi

      - name: the units the package installs are in the tree
        run: |
          set -euo pipefail
          status=0
          for f in packaging/systemd/oxidom.service \
                   packaging/systemd/oxidom@.service \
                   packaging/systemd/oxidom.sysusers; do
            if [ ! -f "$f" ]; then
              echo "::error file=packaging/aur/PKGBUILD::PKGBUILD installs $f, which does not exist"
              status=1
            fi
          done
          exit $status

      - name: namcap
        working-directory: packaging/aur
        run: namcap PKGBUILD
