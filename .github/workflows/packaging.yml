name: packaging

# The AUR package once sat broken because a checksum in PKGBUILD no longer
# matched the file next to it — makepkg stopped at the validity check before it
# reached a compiler, and nothing in the repository noticed. These checks are
# cheap, need no network and no compile, and would have caught exactly that.

on:
  push:
    branches: [master]
    paths: ['packaging/**', '.github/workflows/packaging.yml']
  pull_request:
    paths: ['packaging/**', '.github/workflows/packaging.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aur:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: install tools
        run: pacman -Sy --noconfirm --needed git namcap

      - uses: actions/checkout@v4

      - name: checksums match the packaged files
        working-directory: packaging/aur
        run: |
          set -euo pipefail
          status=0
          for f in oxidom.service oxidom@.service oxidom-git.sysusers; do
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            if ! grep -q "$sum" PKGBUILD; then
              echo "::error file=packaging/aur/PKGBUILD::stale checksum for $f (expected $sum) — run 'updpkgsums' and regenerate .SRCINFO"
              status=1
            fi
          done
          exit $status

      - name: .SRCINFO matches PKGBUILD
        working-directory: packaging/aur
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'makepkg --printsrcinfo' > /tmp/SRCINFO.expected
          if ! diff -u .SRCINFO /tmp/SRCINFO.expected; then
            echo "::error file=packaging/aur/.SRCINFO::out of date — run 'makepkg --printsrcinfo > .SRCINFO'"
            exit 1
          fi

      - name: namcap
        working-directory: packaging/aur
        run: namcap PKGBUILD
