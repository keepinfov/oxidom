name: release

# Turns a `v*` tag into a draft GitHub release with every artifact attached.
# AGENTS.md has said "pushing the tag publishes the release" since before
# anything implemented it; this is that.
#
# The result is a **draft**. A human looks at the asset list and presses publish:
# a release is the one thing in this repository that another commit cannot undo.
#
# The package and AppImage builds live in their own workflows and are called
# from here rather than triggered alongside, so one tag produces one run and the
# publish job can collect what the others built.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rehearse against. Builds everything, publishes nothing.'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap, and everything depends on it. A tag that disagrees with the manifest,
  # or a changelog with nothing written under this version, is a release that
  # should not start rather than one to be cancelled half-built.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: the tag, the manifest and the changelog agree
        # A ${{ }} expression is pasted into the script before the shell parses
        # it, so a tag name would be shell source rather than data. These go
        # through the environment instead, here and everywhere below.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          tag=$TAG
          packaging/version.sh --check-release "$tag"
          echo "version=$(packaging/version.sh)" >> "$GITHUB_OUTPUT"
          # A hyphen means a pre-release: v0.1.0-rc.1 and friends.
          case "$tag" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: the lockfile matches the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      # The desktop entry and the AppStream data are validated by version.yml,
      # on the pull request that changes them. They were checked here too, which
      # cost three minutes of `apt-get update` on the one path where waiting is
      # least welcome — to re-answer a question already answered about files
      # that cannot reach master unreviewed.

  packages:
    needs: verify
    uses: ./.github/workflows/packages.yml

  appimage:
    needs: verify
    uses: ./.github/workflows/appimage.yml

  # Proves the flake still evaluates and builds at the released commit, which is
  # what NixOS users actually consume. It uploads nothing.
  nix:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix build .#oxidom-cli .#oxidom-gui --print-build-logs

  publish:
    needs: [verify, packages, appimage, nix]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Full history and tags: the notes list the commits since the previous tag,
      # and a shallow clone knows neither the tag nor the commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: collect
        run: |
          set -eux
          mkdir -p dist
          find staging -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec mv -t dist/ {} +
          ls -l dist/
          # A release with nothing in it is a failure that looks like a success.
          # Five is the two packages in each of the two formats, plus the AppImage.
          [ "$(find dist -type f | wc -l)" -ge 5 ]
          ( cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS )

      # For a program that carries other people's traffic, provenance is not
      # decoration. Anyone can check an asset came from this repository with
      # `gh attestation verify <file> --repo keepinfov/oxidom`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.deb,dist/*.rpm,dist/*.AppImage'

      - name: release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          version=$VERSION
          # The section for this version, without its own heading and without the
          # next one — the changelog is the release notes, not a second copy.
          # Print from the heading to the end, drop the heading, then cut at the
          # next heading; that last step is a no-op for the final section, which
          # an explicit end address would have mishandled.
          escaped=$(printf '%s' "$version" | sed 's/\./\\./g')
          sed -n "/^## \[$escaped\]/,\$p" CHANGELOG.md \
            | tail -n +2 \
            | sed -n '/^## \[/q;p' > notes.md
          # An empty section means a release with no notes, which verify should
          # already have caught — but publishing one anyway is worse than failing.
          [ -s notes.md ]
          # Which file to download is not obvious from a list of five, and the
          # graphical package alone does not resolve: it depends on the daemon
          # package at the same version, and neither is in any repository, so
          # apt and dnf can only see one if it is named on the command line.
          # Somebody who downloads just the interface gets an unresolvable
          # dependency and nothing explaining it. Say so here, where they are.
          #
          # Indented code blocks rather than backtick fences: backticks inside a
          # quoted shell string read as command substitution to a linter, and
          # markdown renders four-space indentation as code just the same.
          {
            printf '\n---\n\n## Which file\n\n'

            printf '**Debian 13, Ubuntu 25.04 or newer** — both packages, in one command:\n\n'
            printf '    sudo apt install ./oxidom_%s-1_amd64.deb ./oxidom-gui_%s-1_amd64.deb\n\n' "$version" "$version"

            printf '**Fedora 42 or newer:**\n\n'
            printf '    sudo dnf install ./oxidom-%s-1.x86_64.rpm ./oxidom-gui-%s-1.x86_64.rpm\n\n' "$version" "$version"

            printf '**A server, or anything without a desktop** — the daemon alone has no GTK\n'
            printf 'dependency, and installs on Debian 12, Ubuntu 24.04 and RHEL 9 as well:\n\n'
            printf '    sudo apt install ./oxidom_%s-1_amd64.deb\n\n' "$version"

            printf '**Anything older, with a desktop** — the AppImage, which carries its own GTK,\n'
            printf 'its own glibc and an Xray core, and needs nothing installed:\n\n'
            printf '    chmod +x oxidom-%s-x86_64.AppImage && ./oxidom-%s-x86_64.AppImage\n\n' "$version" "$version"

            printf 'The two packages go together: **oxidom-gui** is a thin client and depends\n'
            printf 'on **oxidom**, which carries the daemon it talks to. Installing the\n'
            printf 'interface on its own will not resolve.\n\n'

            printf 'The packages do **not** include an Xray core — no distribution packages one.\n'
            printf 'oxidom starts without it and Settings names the exact download for your\n'
            printf 'machine. The AppImage has one inside it already.\n'

            printf '\n## Verifying a download\n\n'
            printf '    gh attestation verify <file> --repo %s\n' "$REPO"
          } >> notes.md

          # The commits, generated. The changelog above says what changed for a
          # user, which is deliberately not the same list: a release of refactors
          # and CI work reads as an empty one without this.
          #
          # No previous tag means the first release, so the range is every commit
          # reachable from this one. Nothing is truncated -- a list that quietly
          # stopped would read as a shorter release than it was.
          # A dispatch rehearsal names a tag that may not exist yet, so fall back
          # to what is checked out rather than failing the whole notes step.
          if git rev-parse --verify --quiet "$TAG^{commit}" >/dev/null; then
            head=$TAG
          else
            head=HEAD
            echo "note: $TAG is not a commit here; listing commits up to HEAD"
          fi
          prev=$(git describe --tags --abbrev=0 "$head^" 2>/dev/null || true)
          {
            printf '\n## Commits\n\n'
            if [ -n "$prev" ]; then
              printf 'Since %s.\n\n' "$prev"
            fi
            # First parent, so the list is one line per pull request — the merge
            # commit carries the title and the `(#N)` that links it. Walking
            # every commit instead publishes whatever a branch happened to carry
            # and drops the number, which is a longer list that says less.
            #
            # The release commit is dropped: it announces the version and says
            # nothing about the software.
            git log --first-parent --format='- %s' "${prev:+$prev..}$head" \
              | grep -v '^- chore(release)'
          } >> notes.md
          cat notes.md

      - name: draft the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -eu
          flags=""
          if [ "$PRERELEASE" = true ]; then flags=--prerelease; fi
          # shellcheck disable=SC2086  # $flags is one optional flag or nothing
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes-file notes.md \
            $flags \
            dist/*

      - name: rehearsal, so nothing is published
        if: github.event_name != 'push'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: echo "would have drafted $TAG with the assets above"
