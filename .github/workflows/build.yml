name: build

# Proves the two artefacts people actually install still build: the wrapped CLI
# (which the systemd unit runs) and the wrapped GUI (which carries the icon
# theme and the desktop files). The derivations run the crate tests the flake
# names as they build, so a green check here is stronger than a green
# `cargo build`.
#
# It does not replace lint.yml or format.yml. Nothing in the flake runs clippy
# or rustfmt, so dropping those in favour of this would lose both — and they are
# the two cheapest signals in the repository.

# It runs once per pull request rather than once per push. Realising the flake
# costs about fourteen minutes and almost none of it is download, so on a branch
# that lands in five commits it was spending an hour to answer the same question
# five times. `synchronize` is therefore absent from the list below.
#
# `ready_for_review` alone would not do: it fires only when a draft is marked
# ready, so a pull request opened ready would never build here at all. `opened`
# closes that hole, and the `if` below drops the draft case it lets in — a draft
# is by definition not asking for this answer yet.
#
# Nothing enforced is weakened: the `forbid-master` ruleset requires `rustfmt`
# and `nixfmt` and has never required this workflow. The push trigger on master
# stays, so every merge is still built.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, ready_for_review]
    paths: ['crates/**', 'data/**', 'nix/**', 'Cargo.toml', 'Cargo.lock', 'flake.nix', 'flake.lock', '.github/workflows/build.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # nix-quick-install rather than cachix/install-nix-action: cache-nix-action
      # saves and restores /nix/store as one archive, which needs the store to be
      # owned by the runner user — the multi-user daemon install is not.
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true
      # The dependency graph has its own derivation whose inputs are the cargo
      # manifests and the lock file, so its store path is stable across most
      # commits — the precondition a cache needed, per the issue that asked for
      # one. GitHub's Actions cache backs this, so there is no secret involved
      # and a fork's pull request restores the same entries; a run that cannot
      # reach the cache builds from scratch, slower but not broken.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
      # Not `nix build` as well: `checks.{cli,gui}` are the very derivations
      # `packages.{oxidom-cli,oxidom-gui}` name, so building both realised each
      # one twice for one answer. AGENTS.md has said "run one, not both" since
      # before this workflow existed.
      - name: nix flake check
        run: nix flake check --print-build-logs
