[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/keepinfov/oxidom"

[workspace.dependencies]
oxidom-core = { path = "crates/oxidom-core" }
# v4_6 exposes `GtkMenuButton:child`, the only way to give the profile switcher a
# label that can ellipsize; v4_8 does the same for `GtkCheckButton:child`, which
# the server pickers need — a check button's built-in label demands its full
# width, and two hundred provider names then push that demand out through a
# non-scrolling viewport and resize the dialog around them. libadwaita 1.7
# already requires GTK newer than either, so this raises nothing.
gtk = { package = "gtk4", version = "0.9", features = ["v4_8"] }
# v1_7 is `AdwToggleGroup` — the segmented control the scope row is built from,
# whose indicator animates between toggles on its own. Hand-rolling that meant
# owning a widget's worth of layout maths to move one rectangle.
adw = { package = "libadwaita", version = "0.7", features = ["v1_7"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
dirs = "5"
anyhow = "1"
thiserror = "1"
ureq = { version = "2", features = ["json", "socks-proxy"] }
base64 = "0.22"
# Both are already in the tree through ureq; naming them here declares what is
# compiled in rather than adding to it. `default-features = false` with `ring`
# keeps aws-lc-rs — a second crypto stack — out.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ring = "0.17"
# Xray publishes release archives, not bare executables. This extracts the
# source-pinned archive without invoking a system `unzip` binary.
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
percent-encoding = "2"
shell-words = "1"
libc = "0.2"
nix = { version = "0.29", features = ["sched", "process", "mount", "user", "net", "signal", "ioctl"] }
rtnetlink = "0.18.1"
tokio = { version = "1", features = ["rt"] }
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
# The former single crate got zbus's runtime from ksni's `tokio` feature.
# Headless package builds no longer include ksni, so preserve that effective
# feature set explicitly.
zbus = { version = "5.18.0", default-features = false, features = ["blocking-api", "tokio"] }
ksni = { version = "0.3.6", features = ["blocking"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
