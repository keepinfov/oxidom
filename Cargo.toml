[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/keepinfov/oxidom"

[workspace.dependencies]
oxidom-core = { path = "crates/oxidom-core" }
# v4_6 is what exposes `GtkMenuButton:child`, i.e. the only way to give the
# profile switcher a label that can ellipsize. libadwaita 1.4 already requires
# GTK 4.12, so this raises nothing that was not already required.
gtk = { package = "gtk4", version = "0.9", features = ["v4_6"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
dirs = "5"
anyhow = "1"
thiserror = "1"
ureq = { version = "2", features = ["json", "socks-proxy"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
shell-words = "1"
libc = "0.2"
nix = { version = "0.29", features = ["sched", "process", "mount", "user", "net", "signal", "ioctl"] }
rtnetlink = "0.18.1"
tokio = { version = "1", features = ["rt"] }
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
# The former single crate got zbus's runtime from ksni's `tokio` feature.
# Headless package builds no longer include ksni, so preserve that effective
# feature set explicitly.
zbus = { version = "5.18.0", default-features = false, features = ["blocking-api", "tokio"] }
ksni = { version = "0.3.6", features = ["blocking"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
